name: Import exact media-kit assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact published assets
        run: |
          mkdir -p assets
          curl -fL "https://denis-cherepanov.ru/assets/inter.woff2" -o assets/inter.woff2
          curl -fL "https://denis-cherepanov.ru/assets/mont.woff2" -o assets/mont.woff2
          curl -fL "https://denis-cherepanov.ru/assets/portrait-arms-crossed.png" -o assets/portrait-arms-crossed.png
          curl -fL "https://denis-cherepanov.ru/assets/portrait-new.jpg" -o assets/portrait-new.jpg
          curl -fL "https://denis-cherepanov.ru/assets/portrait.jpg" -o assets/portrait.jpg
          curl -fL "https://denis-cherepanov.ru/assets/speaking.jpg" -o assets/speaking.jpg
          curl -fL "https://denis-cherepanov.ru/assets/workshop.jpg" -o assets/workshop.jpg

      - name: Verify exact files
        run: |
          echo "ed6d3fb23d40ab8102326b7896bebbc17b3b059dbcb44680ddbf6d7d372696c3  assets/inter.woff2" | sha256sum -c -
          echo "031e8120eceb39172d41859ca37cf4c5fdf1af86c709802ae67c0b37324925a4  assets/mont.woff2" | sha256sum -c -
          echo "4fed61a31db6f0cbf20e28e4b31e462e62239cbee38f6422063a9161c39dce82  assets/portrait-arms-crossed.png" | sha256sum -c -
          echo "ac7acfae84814d8f8a3031262e3a404470e89626ce66c790f4d544341ff22aa5  assets/portrait-new.jpg" | sha256sum -c -
          echo "521387c241f2cd21a979f636ec604eaac6bbab2fb74c7929a5eba231fe7e2d2b  assets/portrait.jpg" | sha256sum -c -
          echo "2175053f70c890a2cff4896100410e723d0df9652bae7d97764ed2afb4ba801d  assets/speaking.jpg" | sha256sum -c -
          echo "399867c9aac13228a36a05da63e39537041c768ea3ee90628b9e3481038dfa01  assets/workshop.jpg" | sha256sum -c -

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Add exact published media-kit assets" || exit 0
          git push
